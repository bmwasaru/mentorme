{% load humanize %}

<div class="comment">
    <a href="{% url 'profile' comment.user.username %}">{% include "core/includes/avatar.html" with avatar_profile=comment.user.profile avatar_class="pull-left" only %}</a>
    <div class="comment-text">
        <h5>
            <a href="{% url 'profile' comment.user.username %}">{{ comment.user.profile.get_screen_name }}</a>
            <small>{{ comment.date|naturaltime }}</small>
        </h5>
        <p>{{ comment.get_comment_as_markdown|safe }}</p>
    </div>
</div>
