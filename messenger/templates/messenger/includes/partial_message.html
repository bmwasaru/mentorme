<div class="talk-bubble " style="margin-left: 2px; background-color: #f3f3f3;">
    {% include "core/includes/avatar.html" with avatar_profile=message.from_user.profile avatar_class="pull-left" only %}
    <div class="talktext" style="margin-left: 10px; padding-bottom: 5px; padding-top: 0px">
        <h5>
            <small class="pull-right">
                {{ message.date|date:'N d G:i' }}
            </small>
            <a href="{% url 'profile' message.from_user.username %}">
                {{ message.from_user.profile.get_screen_name }}
            </a>
        </h5>
        {{ message.message | linebreaks }}
    </div>
</div>
